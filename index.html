<!DOCTYPE html>
<html>
<head>
    <title>RBZID Demo Site</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #1a1a1a; color: white; }
        .box { background: #2a2a2a; padding: 30px; border-radius: 10px; width: 400px; margin: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔒 Download Page</h1>
        <p>Bago maka-download, verify ka muna na human ka</p>
        
        <iframe src="https://rbzid-test.vercel.app" width="100%" height="200" style="border: 1px solid #444;" id="rbzid-frame"></iframe>
        
        <br><br>
        <button onclick="checkVerify()">Download File</button>
        
        <div id="result"></div>
    </div>

    <script>
        function checkVerify() {
            // Dito dapat iche-check mo kung may RBZID token na from iframe
            // Pero since demo lang, assume natin laging false for now
            let token = window.localStorage.getItem('rbzid_token');
            
            if (!token) {
                alert("Error: Kelangan mo muna mag-verify sa RBZID box sa taas bago maka-download!");
            } else {
                document.getElementById('result').innerHTML = '✅ Verified! Download link: <a href="/api/download?token=' + token + '" style="color: yellow;">secret-file.txt</a>';
            }
        }
    </script>
</body>
</html>
